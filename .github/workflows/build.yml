name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的新提交自动取消旧的运行，省 runner 时间
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit test
    # 刻意钉 24.04 而不是 ubuntu-latest：latest 已于 2026-10-19 起迁往 Ubuntu 26，
    # 预装 Android SDK 的路径与组件版本都可能变。等 26 上的构建验证通过再放开。
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # AGP 9.x 要求 JDK 21，低版本会在配置阶段直接失败
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # 不用第三方 setup-android action：它仍是 Node 20 目标，在强制 Node 24 的
      # runner 上会失败。runner 镜像本身已预装 SDK 并设好 ANDROID_HOME，
      # 这里只补项目需要的版本，缺什么就交给 AGP 自动下载。
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager=$SDKMGR"

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

          # compileSdk 是 API 36 的 minor 版本（36.1），runner 预装的不一定带。
          # 预装失败不直接判死，让下面的 AGP 构建给出真正的错误。
          "$SDKMGR" --install "platform-tools" "platforms;android-36.1" "build-tools;36.1.0" \
            || echo "::warning::SDK 组件预装失败，交由 AGP 自动下载"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # lint 目前有 ~90 个存量 error（多数是 activity_about.xml 的 android:tint），
      # 直接阻断会把这条流水线变成常红。这一步先只跑、只报数，不参与成败判定，
      # 等存量清到可控再改 continue-on-error: false。
      - name: Lint (advisory)
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Lint summary
        if: always()
        run: |
          set -euo pipefail
          REPORT=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ ! -f "$REPORT" ]; then
            echo "::warning::lint 报告未生成，跳过统计"
            exit 0
          fi
          ERRORS=$(grep -c ': Error:' "$REPORT" || true)
          WARNINGS=$(grep -c ': Warning:' "$REPORT" || true)
          UNUSED=$(grep -c 'appears to be unused' "$REPORT" || true)

          {
            echo "### Lint 摘要（仅统计，不阻断）"
            echo ""
            echo "| 指标 | 数量 |"
            echo "| --- | --- |"
            echo "| Error | $ERRORS |"
            echo "| Warning | $WARNINGS |"
            echo "| 未使用资源 | $UNUSED |"
            echo ""
            echo "<details><summary>按类型分布</summary>"
            echo ""
            echo '```'
            grep -E ': (Error|Warning):' "$REPORT" | sed 's/.*\[//' | sed 's/[^A-Za-z].*//' | sort | uniq -c | sort -rn | head -15 || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "lint: errors=$ERRORS warnings=$WARNINGS unused=$UNUSED"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aurora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
