#
# Gradle Wrapper 配置 —— 开源项目必须使用公共可访问的发行版地址。
# 历史上这里曾是 file:///E:/DEV/.gradle/... （本机绝对路径），任何其他人 clone 后
# ./gradlew 都会直接失败，这是「一键可复现构建」的头号阻断，已改为官方 HTTPS 地址。
#
# 如需离线构建：把 -bin 换成你本地已解压的目录不现实（wrapper 只认 zip），
# 正确做法是设置 GRADLE_USER_HOME 让它复用已有缓存，或用
#   ./gradlew --offline …  配合已填充的依赖缓存。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
